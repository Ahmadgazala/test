<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foxy</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #e67e22;
            --text-color: #34495e;
            --transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background: #f8f9fa;
            min-height: 100vh;
            position: relative;
        }

        .navbar {
            background: rgba(255, 255, 255, 0.95);
            padding: 20px 40px;
            box-shadow: var(--shadow);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.8em;
            color: var(--primary-color);
            font-weight: 700;
        }

        .filters {
            display: flex;
            gap: 15px;
        }

        .filter-btn {
            padding: 12px 25px;
            border: none;
            background: #eee;
            border-radius: 30px;
            cursor: pointer;
            transition: var(--transition);
        }

        .filter-btn.active {
            background: var(--accent-color);
            color: white;
        }

        .cart-toggle {
            background: var(--primary-color);
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: var(--transition);
        }

        .cart-toggle:hover {
            background: var(--accent-color);
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 120px 20px 40px;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 35px;
            padding: 20px;
        }

        .product-card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            transition: var(--transition);
            box-shadow: var(--shadow);
        }

        .product-card:hover {
            transform: translateY(-10px);
        }

        .product-media {
            position: relative;
            height: 300px;
            overflow: hidden;
        }

        .product-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: var(--transition);
        }

        .product-card:hover .product-image {
            transform: scale(1.05);
        }

        .product-badge {
            position: absolute;
            top: 15px;
            left: 15px;
            background: var(--accent-color);
            color: white;
            padding: 8px 20px;
            border-radius: 25px;
            font-size: 0.9em;
            z-index: 2;
        }

        .product-content {
            padding: 25px;
        }

        .product-title {
            color: var(--primary-color);
            font-size: 1.3em;
            margin-bottom: 15px;
        }

        .product-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .product-price {
            color: #27ae60;
            font-size: 1.6em;
            font-weight: 700;
        }

        .product-rating {
            display: flex;
            align-items: center;
            gap: 5px;
            color: #f1c40f;
        }

        .product-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
        }

        .btn {
            padding: 12px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background: var(--accent-color);
        }

        .btn-secondary {
            background: #eee;
            color: var(--text-color);
        }

        .btn-secondary:hover {
            background: #ddd;
        }

        .quickview-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .modal-content {
            background: white;
            width: 90%;
            max-width: 800px;
            border-radius: 20px;
            padding: 30px;
            position: relative;
        }

        .close-modal {
            position: absolute;
            top: 15px;
            left: 15px;
            font-size: 24px;
            background: none;
            border: none;
            cursor: pointer;
        }

        .cart-sidebar {
            position: fixed;
            top: 0;
            right: -400px;
            width: 400px;
            height: 100%;
            background: white;
            box-shadow: var(--shadow);
            transition: var(--transition);
            padding: 30px;
            overflow-y: auto;
        }

        .cart-open .cart-sidebar {
            right: 0;
        }

        .cart-item {
            display: flex;
            gap: 15px;
            padding: 15px 0;
            border-bottom: 1px solid #eee;
        }

        .cart-item img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 10px;
        }

        .cart-total {
            font-size: 1.4em;
            font-weight: bold;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid var(--primary-color);
        }

        @media (max-width: 768px) {
            .products-grid {
                grid-template-columns: 1fr;
            }
            
            .navbar {
                flex-direction: column;
                gap: 15px;
                padding: 15px;
            }
            
            .cart-sidebar {
                width: 100%;
                right: -100%;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo"><span><img src="images/foxy.jpg" alt="Logo" style="width: 50px; height: 50px;"></span></div>
        <div class="filters">
            <button class="filter-btn active" data-filter="all">الكل</button>
            <button class="filter-btn" data-filter="electronics">مميز</button>
            <button class="filter-btn" data-filter="fashion">فريد</button>
            <button class="filter-btn" data-filter="home">مذهل</button>
        </div>
        <button class="cart-toggle">🛒 عربة التسوق (<span class="cart-count">0</span>)</button>
    </nav>

    <div class="container">
        <div class="products-grid"></div>
    </div>

    <div class="quickview-modal">
        <div class="modal-content">
            <button class="close-modal">×</button>
            <div id="quickview-content"></div>
        </div>
    </div>

    <div class="cart-sidebar">
        <h2>عربة التسوق</h2>
        <div class="cart-items"></div>
        <div class="cart-total"></div>
        <button class="btn btn-primary" onclick="confirmOrder()" style="width:100%; margin-top:20px;">📨 تأكيد الطلب</button>
    </div>

    <script>
        const products = [
            {
                id: 1,
                name: "تنين  ",
                price: 3.5,
                category: "electronics",
                image: "images/dragon-two.jpg",
                rating: 4.8,
                details: "تصميم مميز وفريد وتفاعلي بفضل المفاصل المتحركة  مما يعطيه سهولة بالحركة "
            },
            {
                id: 2,
                name: "قرد صغير ",
                price: 1.5,
                category: "electronics",
                image: "images/monky.jpg",
                rating: 4.6,
                details: "قرد صغير قابل للحركة مع تصميم مميز وفريد مما يعطيه سهولة بالحركة "
            },
            {
                id: 3,
                name: "تريسراتوبس",
                price: 4,
                category: "fashion",
                image: "images/tryseratops.jpg",
                rating: 4.5,
                details: "   تريسراتوبس هو ديناصور من عائلة الديناصورات ذات القرون الثلاثة، وهو واحد من أشهر الديناصورات في العالم. يتميز بجسمه الضخم ورأسه الكبير الذي يحمل ثلاثة قرون بارزة. يمكنك تركيبه بنفسك "
            },
            {
                id: 4,
                name: "T REX",
                price: 4,
                category: "fashion",
                image: "images/trex.jpg",
                rating: 4.7,
                details: "تيرانوصور ركس هو أحد أكبر الديناصورات آكلة اللحوم، ويعتبر رمزًا شهيرًا في عالم الديناصورات. يتميز بجسمه الضخم ورأسه الكبير الذي يحمل أسنانًا حادة. يمكنك تركيبه بنفسك "
            },
            // {
            //     id: 5,
            //     name:"ستيجوسورس",
            //     price: 1299,
            //     category: "home",
            //     image: "",
            //     rating: 4.5,
            //     details: "10 قطع - مواد آمنة - مقاومة للالتصاق"
            // },
            {
                id: 6,
                name:"اخطبوط فضائي",
                price: 1.5,
                category: "home",
                image: "images/octobes.jpg",
                rating: 4.9,
                details: "هو مزيج بين الاخطبوط والكائنات الفضائية يتميز بمفاصله  التي تعطيه قدرة على الحركة بشكل مذهل"
            },
            {
                id: 7,
                name: "ابو سن",
                price: 1.5,
                category: "electronics",
                image: "images/abusen.jpg",
                rating: 4.8,
                details: "في عالم التنانين حيث كان ابوسن الصديق المناسب ل حازوقة "
            },
            {
                id: 8,
                name: "الفراشة الطائرة",
                price: 1,
                category: "fashion",
                image: "images/windup_butterfly.jpg",
                rating: 4.4,
                details: "حماية UV400 - إطار خفيف الوزن - تصميم كلاسيكي"
            },
            {
                id: 9,
                name: "سلاح الجزرة",
                price: 2.25,
                category: "home",
                image: "images/jzara.jpg",
                rating: 4.2,
                details: "سلاح الجزرة هو سلاح فريد من نوعه يجمع بين التصميم العصري والوظائف المتعددة. يتميز بجودة عالية ومواد متينة، مما يجعله خيارًا مثاليًا لمحبي المغامرات. "
            },
            {
                id: 10,
                name: "هيكل الفراشة",
                price: 2,
                category: "fashion",
                image: "images/butterfly.jpg",
                rating: 4.6,
                details: "هيكل الفراشة هو تصميم فريد يجمع بين الأناقة والراحة. يتميز بجودة عالية ومواد متينة، مما يجعله خيارًا مثاليًا لمحبي مجسمات الحشرات . "
            }
        ];

        let cart = JSON.parse(localStorage.getItem('cart')) || [];

        function renderProducts() {
            const grid = document.querySelector('.products-grid');
            grid.innerHTML = products.map(product => `
                <div class="product-card" data-category="${product.category}">
                    <div class="product-media">
                        <span class="product-badge">جديد</span>
                        <img src="${product.image}" alt="${product.name}" class="product-image">
                    </div>
                    <div class="product-content">
                        <h3 class="product-title">${product.name}</h3>
                        <div class="product-meta">
                            <span class="product-price">${product.price.toLocaleString()} دينار </span>
                            <div class="product-rating">
                                ${'★'.repeat(Math.floor(product.rating))}${'☆'.repeat(5 - Math.floor(product.rating))}
                            </div>
                        </div>
                        <div class="product-actions">
                            <button class="btn btn-primary" onclick="addToCart(${product.id})">🛒 إضافة للسلة</button>
                            <button class="btn btn-secondary" onclick="showQuickView(${product.id})">👀 معاينة سريعة</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const filter = btn.dataset.filter;
                document.querySelectorAll('.product-card').forEach(card => {
                    card.style.display = (filter === 'all' || card.dataset.category === filter) ? 'block' : 'none';
                });
            });
        });

        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            const existingItem = cart.find(item => item.id === productId);
            
            if(existingItem) {
                existingItem.quantity++;
            } else {
                product.quantity = 1;
                cart.push(product);
            }
            
            localStorage.setItem('cart', JSON.stringify(cart));
            updateCartUI();
            renderCartItems();
        }

        function removeFromCart(productId) {
            cart = cart.filter(item => item.id !== productId);
            localStorage.setItem('cart', JSON.stringify(cart));
            updateCartUI();
            renderCartItems();
        }

        function updateCartUI() {
            document.querySelector('.cart-count').textContent = cart.length;
        }

        function renderCartItems() {
            const cartItems = document.querySelector('.cart-items');
            cartItems.innerHTML = cart.map(item => `
                <div class="cart-item">
                    <img src="${item.image}" alt="${item.name}" width="60">
                    <div>
                        <h4>${item.name}</h4>
                        <p>${item.price.toLocaleString()} دينار × ${item.quantity}</p>
                        <button onclick="removeFromCart(${item.id})" class="btn btn-secondary">إزالة</button>
                    </div>
                </div>
            `).join('');
            
            document.querySelector('.cart-total').innerHTML = `
                الإجمالي: ${cart.reduce((sum, item) => sum + (item.price * item.quantity), 0).toLocaleString()}دينار 
            `;
        }

        function confirmOrder() {
            if(cart.length === 0) {
                alert('العربة فارغة! الرجاء إضافة منتجات أولاً');
                return;
            }

            const phoneNumber = '962785131316'; // رقم الواتساب مع رمز الدولة
            const itemsList = cart.map(item => 
                `- ${item.name} (${item.quantity}x): ${(item.price * item.quantity).toLocaleString()} دينار`
            ).join('%0A');

            const totalAmount = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            
            const message = encodeURIComponent(
                'مرحبا، أريد تأكيد الطلب التالي:%0A%0A' +
                itemsList + 
                '%0A%0A' +
                `الإجمالي: ${totalAmount.toLocaleString()} دينار ` +
                '%0A%0Aالرجاء تأكيد الطلب وشكراً'
            );

            const whatsappUrl = `https://wa.me/${phoneNumber}?text=${message}`;
            window.open(whatsappUrl, '_blank');
        }

        document.querySelector('.cart-toggle').addEventListener('click', () => {
            document.body.classList.toggle('cart-open');
        });

        function showQuickView(productId) {
            const product = products.find(p => p.id === productId);
            document.querySelector('#quickview-content').innerHTML = `
                <div class="quickview-product">
                    <img src="${product.image}" alt="${product.name}" style="width:100%; height:400px; object-fit:cover; border-radius:15px;">
                    <h2>${product.name}</h2>
                    <p>${product.details}</p>
                    <div class="product-price">${product.price.toLocaleString()} دينار</div>
                    <button class="btn btn-primary" onclick="addToCart(${product.id})">إضافة للسلة</button>
                </div>
            `;
            document.querySelector('.quickview-modal').style.display = 'flex';
        }

        document.querySelector('.close-modal').addEventListener('click', () => {
            document.querySelector('.quickview-modal').style.display = 'none';
        });

        // التهيئة الأولية
        renderProducts();
        updateCartUI();
        renderCartItems();
    </script>
</body>
</html>
